[project]
name = "benchcommons-dataset-tool"
version = "0.1.0"
description = "Shared tooling for BenchCommons dataset repos: source download cache, spreadsheet reader, adapter base and source registry"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "pyyaml==6.0.3",
    "xlrd==2.0.2",
]

[project.urls]
Repository = "https://github.com/BenchCommons/dataset-tool"

[dependency-groups]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datasettool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
